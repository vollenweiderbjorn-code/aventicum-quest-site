<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Merci — Aventicum Quest</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
  <!-- Privacy-friendly analytics by Plausible — page atteinte après paiement = objectif de conversion -->
  <script async src="https://plausible.io/js/pa-ELx2kKywInJ5MKZ1ST8au.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
  <style>
    body { background: var(--obsidian); }
    .merci-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .merci-card {
      max-width: 560px;
      background: var(--pierre);
      border: 1px solid var(--border);
      padding: 4rem 3rem;
      position: relative;
    }
    .merci-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--terre), var(--aurum), var(--scriptum));
    }
    .merci-icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    .merci-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: var(--aurum);
      margin-bottom: 1rem;
      letter-spacing: 0.08em;
    }
    .merci-text {
      color: var(--scriptum-dim);
      font-family: 'EB Garamond', serif;
      font-size: 1.1rem;
      line-height: 1.7;
      font-style: italic;
      margin-bottom: 2rem;
    }
    .merci-note {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: .06em;
      color: var(--terre);
      line-height: 1.7;
      padding: 1rem 1.25rem;
      background: var(--aurum-faint);
      border: 1px solid var(--border);
      border-radius: 3px;
      margin-bottom: 2.5rem;
    }
    .merci-note strong { color: var(--scriptum); }
    .btn-retour {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.85rem 2rem;
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      color: var(--aurum);
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }
    .btn-retour:hover {
      background: var(--aurum);
      color: var(--obsidian);
    }
  </style>
</head>
<body>
  <section class="merci-section">
    <div class="merci-card">
      <span class="merci-icon">🦅</span>
      <h1 class="merci-title">Paiement confirmé</h1>
      <p class="merci-text">
        Votre mission commence. Votre code de jeu vous a été envoyé par e-mail — vérifiez votre boîte de réception dans les prochaines minutes.
      </p>
      <div class="merci-note">
        <strong>Pas de code reçu ?</strong><br>
        Vérifiez vos spams. Si rien sous 5 minutes, écrivez-nous à <strong>info@aventicumquest.ch</strong>
      </div>
      <a href="index.html" class="btn-retour">← Retour à l'accueil</a>
    </div>
  </section>
</body>
</html>
